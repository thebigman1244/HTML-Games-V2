<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HardMath | Game Portal</title>
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https:;">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0b1020;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 40px;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 30% 30%, rgba(99,102,241,0.1), transparent 55%), radial-gradient(circle at 70% 70%, rgba(14,165,233,0.1), transparent 55%);
            pointer-events: none;
            z-index: 0;
        }
        .c {
            background: rgba(15,23,42,0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(99,102,241,0.2);
            border-radius: 20px;
            padding: 35px;
            width: 100%;
            max-width: 800px;
            position: relative;
            z-index: 1;
        }
        .top { display: flex; justify-content: flex-end; margin-bottom: 20px; }
        .tbtn {
            padding: 8px 16px;
            background: rgba(239,68,68,0.12);
            border: 1px solid rgba(239,68,68,0.3);
            color: #f87171;
            border-radius: 8px;
            font-size: 0.85rem;
            text-decoration: none;
            font-weight: 600;
        }
        .tbtn:hover { background: rgba(239,68,68,0.2); }
        .h { display: flex; align-items: center; margin-bottom: 25px; padding-bottom: 20px; border-bottom: 1px solid rgba(99,102,241,0.2); }
        .lo {
            background: linear-gradient(135deg, #6366f1, #0ea5e9);
            width: 56px;
            height: 56px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 800;
            margin-right: 16px;
            color: #fff;
            font-family: 'Cambria Math', serif;
        }
        .t h1 { font-size: 1.5rem; margin-bottom: 2px; font-weight: 700; }
        .t p { color: #64748b; font-size: 0.85rem; }
        
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
        }
        
        .game-btn {
            background: #1e293b;
            border: 1px solid #334155;
            color: #e2e8f0;
            padding: 15px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s;
            text-align: center;
            font-size: 0.9rem;
        }
        .game-btn:hover {
            background: #334155;
            transform: translateY(-2px);
            border-color: #6366f1;
        }
        .game-btn span {
            display: block;
            font-size: 1.2rem;
            margin-bottom: 5px;
        }
        .loading {
            text-align: center;
            color: #6366f1;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="c">
        <div class="top"><a href="/?action=logout" class="tbtn">Logout</a></div>
        <div class="h">
            <div class="lo">&#8721;</div>
            <div class="t">
                <h1>Game Portal</h1>
                <p>Loading games from repository...</p>
            </div>
        </div>

        <div class="game-grid" id="gameGrid">
            <div class="loading">Fetching 410+ games...</div>
        </div>
    </div>

    <script>
        const repoOwner = 'thebigman1244';
        const repoName = 'HTML-Games-V2';
        const gameGrid = document.getElementById('gameGrid');

        async function loadGames() {
            try {
                // Fetch the directory contents
                const response = await fetch(`https://api.github.com/repos/${repoOwner}/${repoName}/contents/play.html?ref=main`);
                if (!response.ok) throw new Error('Failed to fetch games');
                
                const data = await response.json();
                
                // If it's a directory
                if (Array.isArray(data)) {
                    renderButtons(data);
                } else {
                    // If it's a single file (fallback)
                    gameGrid.innerHTML = '<div class="loading">No games found in directory. Check repo structure.</div>';
                }
            } catch (error) {
                gameGrid.innerHTML = '<div class="loading">Error loading games. Please check your github link.</div>';
                console.error(error);
            }
        }

        function renderButtons(files) {
            gameGrid.innerHTML = '';
            files.forEach(file => {
                if (file.name.endsWith('.html')) {
                    const cleanName = file.name.replace('.html', '');
                    const btn = document.createElement('a');
                    btn.className = 'game-btn';
                    btn.href = `play.html?game=${cleanName}`;
                    btn.innerHTML = `<span>🎮</span> ${cleanName}`;
                    gameGrid.appendChild(btn);
                }
            });
        }

        loadGames();
    </script>
</body>
</html>
