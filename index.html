<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HardMath | Game Portal</title>
    <meta name="viewport" content="width=device-width,initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self' 'unsafe-inline' 'unsafe-eval' https:; script-src 'self' 'unsafe-inline' 'unsafe-eval' https:; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self' https:;">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0b1020;
            color: #e2e8f0;
            min-height: 100vh;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding-top: 40px;
        }
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: radial-gradient(circle at 30% 30%, rgba(99,102,241,0.1), transparent 55%), radial-gradient(circle at 70% 70%, rgba(14,165,233,0.1), transparent 55%);
            pointer-events: none;
            z-index: 0;
        }
        .c {
            background: rgba(15,23,42,0.85);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(99,102,241,0.2);
            border-radius: 20px;
            padding: 35px;
            width: 100%;
            max-width: 800px;
            position: relative;
            z-index: 1;
        }
        .top { display: flex; justify-content: flex-end; margin-bottom: 20px; }
        .tbtn {
            padding: 8px 16px;
            background: rgba(239,68,68,0.12);
            border: 1px solid rgba(239,68,68,0.3);
            color: #f87171;
            border-radius: 8px;
            font-size: 0.85rem;
            text-decoration: none;
            font-weight: 600;
        }
        .tbtn:hover { background: rgba(239,68,68,0.2); }
        .h { display: flex; align-items: center; margin-bottom: 25px; padding-bottom: 20px; border-bottom: 1px solid rgba(99,102,241,0.2); }
        .lo {
            background: linear-gradient(135deg, #6366f1, #0ea5e9);
            width: 56px;
            height: 56px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.8rem;
            font-weight: 800;
            margin-right: 16px;
            color: #fff;
            font-family: 'Cambria Math', serif;
        }
        .t h1 { font-size: 1.5rem; margin-bottom: 2px; font-weight: 700; }
        .t p { color: #64748b; font-size: 0.85rem; }
        
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
        }
        
        .game-btn {
            background: #1e293b;
            border: 1px solid #334155;
            color: #e2e8f0;
            padding: 15px;
            border-radius: 10px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s;
            text-align: center;
            font-size: 0.9rem;
        }
        .game-btn:hover {
            background: #334155;
            transform: translateY(-2px);
            border-color: #6366f1;
        }
        .game-btn span {
            display: block;
            font-size: 1.2rem;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    <div class="c">
        <div class="top"><a href="/?action=logout" class="tbtn">Logout</a></div>
        <div class="h">
            <div class="lo">&#8721;</div>
            <div class="t">
                <h1>Game Portal</h1>
                <p>Select a game to play</p>
            </div>
        </div>

        <h3 style="margin-bottom: 15px; color: #e2e8f0;">Available Games</h3>
        <div class="game-grid">
            <!-- Add or remove games here based on your repo -->
            <a href="play.html?game=snake" class="game-btn">
                <span>🐍</span> Snake
            </a>
            <a href="play.html?game=breakout" class="game-btn">
                <span>🧱</span> Breakout
            </a>
            <a href="play.html?game=tetris" class="game-btn">
                <span>🧩</span> Tetris
            </a>
            <a href="play.html?game=pong" class="game-btn">
                <span>🏓</span> Pong
            </a>
            <a href="play.html?game=tank" class="game-btn">
                <span>🚀</span> Tank Battle
            </a>
            <a href="play.html?game=flappy" class="game-btn">
                <span>🐦</span> Flappy Bird
            </a>
        </div>
    </div>
</body>
</html>
