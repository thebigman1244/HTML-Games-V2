<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HardMath | Game Mode</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b1020;
            color: #fff;
            font-family: sans-serif;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .game-header {
            padding: 10px 20px;
            background: rgba(15,23,42,0.95);
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .game-title {
            font-weight: bold;
            color: #6366f1;
        }
        .game-container {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }
        /* This container holds the injected game content */
        #game-content {
            width: 100%;
            height: 100%;
        }
        canvas {
            max-width: 100%;
            max-height: 100%;
        }
        .instructions {
            position: absolute;
            bottom: 20px;
            color: #94a3b8;
            font-size: 0.9rem;
            text-align: center;
            pointer-events: none;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="game-header">
        <span class="game-title" id="gameName">Loading...</span>
        <button onclick="location.href='index.html'" style="padding: 5px 15px; background: #ef4444; color: white; border: none; border-radius: 5px; cursor: pointer;">Exit</button>
    </div>
    
    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="600" tabindex="0"></canvas>
        <div class="instructions" id="gameControls">Press \\ to Panic • Keyboard Controls Active</div>
    </div>

    <script>
        // --- PANEIC BUTTON LOGIC ---
        document.addEventListener('keydown', (e) => {
            if (e.key === '\\') {
                window.location.href = 'index.html';
            }
        });

        // --- KEYBOARD INPUT LOGIC ---
        const canvas = document.getElementById('gameCanvas');
        
        window.onload = function() {
            canvas.focus();
        };

        window.addEventListener("keydown", function(e) {
            if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.code) > -1) {
                e.preventDefault();
            }
        }, false);

        // --- GAME LOADER ---
        const params = new URLSearchParams(window.location.search);
        const gameName = params.get('game');
        const gameContainer = document.getElementById('game-content');
        const gameTitle = document.getElementById('gameName');

        if (!gameName) {
            gameTitle.textContent = "No Game Selected";
            loadGame('snake'); // Default fallback
        } else {
            loadGame(gameName);
        }

        async function loadGame(gameName) {
            gameTitle.textContent = gameName.charAt(0).toUpperCase() + gameName.slice(1);
            
            const repoOwner = 'thebigman1244';
            const repoName = 'HTML-Games-V2';
            const fileUrl = `https://raw.githubusercontent.com/${repoOwner}/${repoName}/main/${gameName}.html`;

            try {
                const response = await fetch(fileUrl);
                if (!response.ok) throw new Error('Game not found');
                
                let gameHtml = await response.text();
                
                // Clean up the HTML (remove head/body if present to prevent duplication)
                gameHtml = gameHtml.replace(/<head[^>]*>.*?<\/head>/gi, '');
                gameHtml = gameHtml.replace(/<body[^>]*>/gi, '');
                gameHtml = gameHtml.replace(/<\/body>/gi, '');
                gameHtml = gameHtml.replace(/<html[^>]*>/gi, '');
                gameHtml = gameHtml.replace(/<\/html>/gi, '');

                // Inject into container
                gameContainer.innerHTML = gameHtml;

                // Re-focus canvas
                canvas.focus();
                console.log(`Loaded ${gameName}`);

            } catch (error) {
                gameContainer.innerHTML = `<div style="color:white; padding:20px;">Game '${gameName}' not found.<br>Error: ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
