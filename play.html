<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HardMath | Game Mode</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b1020;
            color: #fff;
            font-family: sans-serif;
            overflow: hidden; 
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .game-header {
            padding: 10px 20px;
            background: rgba(15,23,42,0.95);
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .game-title {
            font-weight: bold;
            color: #6366f1;
        }
        .game-container {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }
        canvas {
            background: #000;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            max-width: 100%;
            max-height: 100%;
        }
        .instructions {
            position: absolute;
            bottom: 20px;
            color: #94a3b8;
            font-size: 0.9rem;
            text-align: center;
            pointer-events: none;
            background: rgba(0,0,0,0.5);
            padding: 5px 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div class="game-header">
        <span class="game-title" id="gameName">Game Mode</span>
        <button onclick="location.href='index.html'" style="padding: 5px 15px; background: #ef4444; color: white; border: none; border-radius: 5px; cursor: pointer;">Exit</button>
    </div>
    
    <div class="game-container">
        <canvas id="gameCanvas" width="800" height="600" tabindex="0"></canvas>
        <div class="instructions" id="gameControls">Press \\ to Panic • Keyboard Controls Active</div>
    </div>

    <script>
        // --- PANEIC BUTTON LOGIC ---
        document.addEventListener('keydown', (e) => {
            if (e.key === '\\') {
                window.location.href = 'index.html';
            }
        });

        // --- KEYBOARD INPUT LOGIC ---
        const canvas = document.getElementById('gameCanvas');
        
        window.onload = function() {
            canvas.focus();
            console.log("Game Canvas Focused. Waiting for game load...");
        };

        window.addEventListener("keydown", function(e) {
            if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.code) > -1) {
                e.preventDefault();
            }
        }, false);

        // --- GAME LOADER ---
        const params = new URLSearchParams(window.location.search);
        const gameName = params.get('game');
        const ctx = canvas.getContext('2d');
        const gameTitle = document.getElementById('gameName');
        const controls = document.getElementById('gameControls');

        // Initialize the default game
        if (!gameName) {
            loadGame('snake'); // Default to Snake
        } else {
            loadGame(gameName);
        }

        function loadGame(game) {
            gameTitle.textContent = game.charAt(0).toUpperCase() + game.slice(1);
            
            // --- GAME LOGIC AREA ---
            // You can add specific game logic here or load script files.
            // Example for Snake:
            
            if (game === 'snake') {
                runSnakeGame();
            } 
            else if (game === 'breakout') {
                runBreakoutGame();
            }
            // Add more games below:
            // else if (game === 'tetris') { runTetrisGame(); }
            else {
                ctx.fillStyle = '#fff';
                ctx.font = '30px Arial';
                ctx.fillText("Game '" + game + "' not loaded.", 250, 300);
                ctx.font = '16px Arial';
                ctx.fillText("Add logic for this game in play.html", 250, 330);
            }
        }

        // --- PLACEHOLDER SNAKE GAME ---
        function runSnakeGame() {
            let snake = [{x: 10, y: 10}];
            let food = {x: 15, y: 15};
            let dx = 1;
            let dy = 0;
            const gridSize = 20;

            function draw() {
                // Clear background
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Move Snake
                const head = {x: snake[0].x + dx, y: snake[0].y + dy};
                snake.unshift(head);

                // Check Food
                if (head.x === food.x && head.y === food.y) {
                    food = {x: Math.floor(Math.random() * 40), y: Math.floor(Math.random() * 30)};
                } else {
                    snake.pop();
                }

                // Draw Food
                ctx.fillStyle = 'red';
                ctx.fillRect(food.x * gridSize, food.y * gridSize, gridSize - 2, gridSize - 2);

                // Draw Snake
                ctx.fillStyle = '#6366f1';
                snake.forEach(part => {
                    ctx.fillRect(part.x * gridSize, part.y * gridSize, gridSize - 2, gridSize - 2);
                });

                requestAnimationFrame(draw);
            }

            // Listen for Snake Controls
            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowUp' && dy === 0) { dx = 0; dy = -1; }
                if (e.key === 'ArrowDown' && dy === 0) { dx = 0; dy = 1; }
                if (e.key === 'ArrowLeft' && dx === 0) { dx = -1; dy = 0; }
                if (e.key === 'ArrowRight' && dx === 0) { dx = 1; dy = 0; }
            });

            draw();
        }

        // --- PLACEHOLDER BREAKOUT GAME ---
        function runBreakoutGame() {
            let paddle = {x: 350, y: 550, w: 100, h: 10};
            let ball = {x: 400, y: 500, dx: 4, dy: -4, r: 8};
            const bricks = [];
            for(let i=0; i<8; i++) bricks[i] = {x: i*100 + 50, y: 100, status: 1};

            function draw() {
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(0, 0, canvas.width, canvas.height);

                // Draw Paddle
                ctx.fillStyle = '#6366f1';
                ctx.fillRect(paddle.x, paddle.y, paddle.w, paddle.h);

                // Draw Ball
                ctx.beginPath();
                ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI*2);
                ctx.fillStyle = '#fff';
                ctx.fill();
                ctx.closePath();

                // Bricks
                bricks.forEach(b => {
                    if(b.status === 1) {
                        ctx.fillStyle = '#0ea5e9';
                        ctx.fillRect(b.x, b.y, 80, 20);
                    }
                });

                // Move Ball
                ball.x += ball.dx;
                ball.y += ball.dy;

                // Wall Collision
                if(ball.x + ball.dx > canvas.width - ball.r || ball.x + ball.dx < ball.r) ball.dx = -ball.dx;
                if(ball.y + ball.dy < ball.r) ball.dy = -ball.dy;
                if(ball.y + ball.dy > canvas.height - ball.r) {
                    if(ball.x > paddle.x && ball.x < paddle.x + paddle.w) ball.dy = -ball.dy;
                    else {
                        // Reset
                        ball.x = 400; ball.y = 500; ball.dx = 4; ball.dy = -4;
                    }
                }

                requestAnimationFrame(draw);
            }

            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowLeft') paddle.x -= 20;
                if (e.key === 'ArrowRight') paddle.x += 20;
            });

            draw();
        }
    </script>
</body>
</html>
