<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HardMath | Games</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #0b1020; font-family: sans-serif; }
    iframe { width: 100%; height: 100%; border: none; display: block; }
  </style>
</head>
<body>

  <iframe id="gameFrame" src=""></iframe>

  <script>
    const WORKER_URL = "YOUR_WORKER_URL"; // PASTE YOUR WORKER URL HERE
    const GAME_URL = "https://html-games-v2-cxz5.onrender.com"; // Your actual game site URL

    const iframe = document.getElementById('gameFrame');

    // Load game into iframe via Worker proxy
    iframe.src = WORKER_URL + "/?url=" + encodeURIComponent(GAME_URL);

    // This script injects the focus/click fix into the game page
    // It runs every time the page loads
    window.addEventListener('load', function() {
      const script = document.createElement('script');
      script.textContent = `
        (function(){
          var PO = '${WORKER_URL}';
          var TO = '${GAME_URL}';
          var BASE = '${GAME_URL}';
          
          // Rewrite URLs for images/css
          function rw(u){
            if(!u || typeof u !== "string") return u;
            if(["data:","blob:","javascript:","mailto:","tel:","sms:","#"].some(function(p){ return u.startsWith(p)})) return u;
            if(u.includes(PO)) return u;
            var a;
            try{
              if(u.startsWith("//")) a = "https:" + u;
              else if(u.startsWith("/")) a = TO + u;
              else if(u.startsWith("http")) a = u;
              else a = new URL(u, BASE).href;
            } catch(e){ return u }
            return PO + "/?url=" + encodeURIComponent(a);
          }
          
          // Inject into anchor tags
          document.addEventListener("click", function(e){
            var a = e.target.closest && e.target.closest("a");
            if(a && a.href && a.href.includes("http") && !a.href.includes(PO)){
              e.preventDefault();
              window.location.href = rw(a.href);
            }
          });
          
          // Ensure focus stays on game, not url bar
          document.body.focus();
        })();
      `;
      document.head.appendChild(script);
    });
  </script>
</body>
</html>
