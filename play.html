<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HardMath | Game Mode</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b1020;
            color: #fff;
            font-family: sans-serif;
            overflow: hidden; /* Prevent scrolling when playing */
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        .game-header {
            padding: 10px 20px;
            background: rgba(15,23,42,0.9);
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        .game-title {
            font-weight: bold;
            color: #6366f1;
        }
        .game-container {
            flex: 1;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
        }
        canvas {
            background: #000;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            max-width: 100%;
            max-height: 100%;
        }
        .instructions {
            position: absolute;
            bottom: 20px;
            color: #94a3b8;
            font-size: 0.9rem;
            text-align: center;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div class="game-header">
        <span class="game-title">Game Mode</span>
        <button onclick="location.href='index.html'" style="padding: 5px 15px; background: #ef4444; color: white; border: none; border-radius: 5px; cursor: pointer;">Exit to Dashboard</button>
    </div>
    
    <div class="game-container">
        <!-- 
            IMPORTANT: 
            The canvas has tabindex="0" so it can receive keyboard focus.
            The game logic will listen to this canvas.
        -->
        <canvas id="gameCanvas" width="800" height="600" tabindex="0"></canvas>
        <div class="instructions">Press \\ to Panic (Exit) • Use Arrow Keys or WASD to Play</div>
    </div>

    <script>
        // --- PANEIC BUTTON LOGIC ---
        document.addEventListener('keydown', (e) => {
            // Backslash key
            if (e.key === '\\') {
                window.location.href = 'index.html';
            }
        });

        // --- KEYBOARD INPUT LOGIC ---
        // This ensures the canvas is focused so keyboard events are captured immediately
        const canvas = document.getElementById('gameCanvas');
        
        // Focus the canvas when the page loads
        window.onload = function() {
            canvas.focus();
            console.log("Game Canvas Focused. Keyboard input active.");
        };

        // Optional: Prevent scrolling when using arrow keys
        window.addEventListener("keydown", function(e) {
            if(["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.code) > -1) {
                e.preventDefault();
            }
        }, false);

        // --- PLACEHOLDER GAME LOOP ---
        // You can replace this loop with your specific game code
        const ctx = canvas.getContext('2d');
        let gameRunning = true;
        let rectX = 50;
        let rectY = 50;

        function draw() {
            if (!gameRunning) return;
            
            // Clear screen
            ctx.fillStyle = '#0f172a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw player
            ctx.fillStyle = '#6366f1';
            ctx.fillRect(rectX, rectY, 40, 40);

            // Draw text
            ctx.fillStyle = '#fff';
            ctx.font = '20px Arial';
            ctx.fillText("Welcome to Game Mode!", 20, 30);
            ctx.fillText("Arrow Keys to Move", 20, 60);

            requestAnimationFrame(draw);
        }

        // Listen for movement
        window.addEventListener('keydown', (e) => {
            const speed = 20;
            if (e.key === 'ArrowUp' || e.key === 'w') rectY -= speed;
            if (e.key === 'ArrowDown' || e.key === 's') rectY += speed;
            if (e.key === 'ArrowLeft' || e.key === 'a') rectX -= speed;
            if (e.key === 'ArrowRight' || e.key === 'd') rectX += speed;
        });

        draw();

    </script>
</body>
</html>
